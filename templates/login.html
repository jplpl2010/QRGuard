
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - QR Guard</title>
</head>
<body>
    <h1>QR Guard</h1>
    <h2>Painel administrativo</h2>

    {% if erro %}
        <p>{{ erro }}</p>
    {% endif %}

    <form method="POST">
        <label for="senha">Senha de administrador:</label>
        <input
            type="password"
            id="senha"
            name="senha"
            required
        >
        <button type="submit">Entrar</button>
    </form>
</body>
</html>
